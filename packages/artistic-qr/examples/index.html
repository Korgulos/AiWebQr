<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Artistic QR package demo</title>
<style>body{font:18px system-ui;max-width:650px;margin:40px auto;padding:16px}label{display:block;margin:16px 0}img{display:block;max-width:100%;image-rendering:auto}button,a{margin:12px 0;display:inline-block}</style>
<h1>Artistic QR package demo</h1>
<label>Text or URL <input id="text" value="https://www.qr-gen-me.com/"></label>
<label>Image or GIF <input id="file" type="file" accept="image/*"></label>
<label>Background URL (optional) <input id="background-url" placeholder="https://example.com/background.gif"></label>
<label><input id="animated" type="checkbox"> Animate background URL</label>
<button id="generate">Generate QR</button><p id="status" role="status"></p><img id="preview" alt="Generated QR"><a id="download" hidden>Download</a>
<script type="module">
import {generateArtisticQR} from '../dist/index.js';
let previous;
document.querySelector('#generate').onclick=async()=>{
 const status=document.querySelector('#status'); status.textContent='Generating…'; const button=document.querySelector('button'); button.disabled=true;
 try {
  const blob=await generateArtisticQR({text:document.querySelector('#text').value,background:document.querySelector('#background-url').value || document.querySelector('#file').files[0],animated:document.querySelector('#background-url').value ? document.querySelector('#animated').checked : undefined,onProgress:message=>status.textContent=message});
  if(previous) URL.revokeObjectURL(previous); previous=URL.createObjectURL(blob);
  document.querySelector('#preview').src=previous;
  const link=document.querySelector('#download');link.href=previous;link.download=blob.type==='image/gif'?'artistic-qr.gif':'artistic-qr.png';link.hidden=false;
  status.textContent=`Ready: ${blob.type}, ${blob.size} bytes`;
 } catch(error){status.textContent=error.message;} finally{button.disabled=false;}
};
</script></html>
